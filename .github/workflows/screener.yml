name: JPX Screener

on:
  schedule:
    # 平日 16:30 JST = 07:30 UTC（同日内のため曜日はそのまま UTC の月〜金でよい）
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_MAILADDRESS: ${{ secrets.JQUANTS_MAILADDRESS }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
        run: python main.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: results/*.csv

      - name: Commit results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*.csv
          git diff --cached --quiet || git commit -m "chore: update screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
